
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compras</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
</head>
<body>

    <main class="contenedor">
        <h1>Calculadora de Compras (pre-entrega 7)</h1>
        <p>Mi simulador de productos con JavaScript</p>

        <h2>Agregar producto</h2>

        <form id="formulario">
            <input type="text" id="nombre" placeholder="Nombre del producto" required>
            <input type="number" id="precio" placeholder="Precio" min="1" required>
            <input type="number" id="stock" placeholder="Stock" min="0" required>

            <button type="submit">Agregar producto</button>
        </form>

        <p id="mensaje"></p>

        <h2>Mis productos</h2>

        <input type="text" id="buscador" placeholder="Buscar producto...">

        <div id="contenedor-productos"></div>

        <h2 id="total"></h2>
    </main>

</body>
</html>
